version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "18010:18010"
    environment:
      - DISABLE_AUTH=true
      - DATABASE_URL=sqlite:///./boletin.db
    volumes:
      - ./:/app:delegated
    # Use the image CMD (python -m uvicorn ...) defined in the Dockerfile
