version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/app:delegated
      - ./boletin.db:/app/boletin.db:ro
    environment:
      - DATABASE_URL=sqlite:///./boletin.db
    ports:
      - "18010:18010"
    command: uvicorn app.main:app --host 0.0.0.0 --port 18010 --reload
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:18010/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
